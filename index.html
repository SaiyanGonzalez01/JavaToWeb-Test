<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CheerpJ Java App Example</title>
    <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
  </head>
  <body>
    <script>
      (async function () {
        await cheerpjInit();
        cheerpjCreateDisplay(320, 240);
        await cheerpjRunMain(
                  "com.mojang.chambered.Chambered",
                  "/app/chambered.jar"
                );
      })();
    </script>
  </body>
</html>
